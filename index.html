<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Happy Birthday</title>
<meta name="theme-color" content="#0a0618">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Great+Vibes&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --gold1:#8a5a12; --gold2:#f9e08b; --gold3:#fff7cf; --gold4:#d9a52b;
  --redirect-url:"https://sankha1769.github.io/Happy-Birthday-/";
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0618;touch-action:manipulation;
  font-family:'Poppins',system-ui,sans-serif;color:#fff;-webkit-user-select:none;user-select:none}
body{
  background:
    radial-gradient(1200px 800px at 50% 115%, #6a1b52 0%, transparent 62%),
    radial-gradient(900px 700px at 85% -10%, #1f2f7a 0%, transparent 60%),
    radial-gradient(800px 600px at 5% 30%, #3b1068 0%, transparent 60%),
    linear-gradient(#090514, #170a2b 55%, #2a0f3a);
}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:60;
  background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%)}
canvas#bokeh{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
canvas#confetti{position:fixed;inset:0;z-index:55;pointer-events:none}

/* ---------- pages ---------- */
.page{position:fixed;inset:0;z-index:1;opacity:0;visibility:hidden;transform:scale(.94);filter:blur(10px);
  transition:opacity .9s ease,transform 1s cubic-bezier(.2,.8,.2,1),filter .9s ease,visibility 0s linear .9s;overflow:hidden}
.page.active{opacity:1;visibility:visible;transform:none;filter:none;transition-delay:0s;z-index:2}
.page.leaving{opacity:0;visibility:visible;transform:scale(1.12);filter:blur(12px);z-index:1}

/* ---------- PAGE 1 ---------- */
.lights{position:absolute;top:0;left:0;right:0;height:80px;z-index:6;pointer-events:none}
.lights svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.bulb{position:absolute;width:12px;height:17px;border-radius:50% 50% 45% 45%;transform:translate(-50%,0);
  animation:twinkle 2.4s ease-in-out infinite}
.bulb::before{content:"";position:absolute;left:50%;top:-5px;width:6px;height:6px;background:#555;transform:translateX(-50%);border-radius:1px}
@keyframes twinkle{0%,100%{opacity:1;filter:brightness(1.25)}50%{opacity:.55;filter:brightness(.8)}}

.hero{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:4;padding:0 20px}
.kicker{font-size:clamp(11px,1.6vw,16px);letter-spacing:.5em;text-transform:uppercase;color:#ffd9a0;opacity:0;
  animation:fadeUp 1.4s .3s forwards;text-shadow:0 0 14px rgba(255,190,100,.6);margin-bottom:6px}
.gold{background:linear-gradient(100deg,#8a5a12 0%,#f9e08b 16%,#fff7cf 26%,#d9a52b 38%,#8a5a12 52%,#ffe9a0 68%,#fff7cf 76%,#b9791a 100%);
  background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  animation:shine 6s linear infinite}
@keyframes shine{to{background-position:-260% 0}}
.script{font-family:'Great Vibes','Brush Script MT',cursive;font-weight:400;font-size:clamp(60px,14vw,170px);line-height:1;
  filter:drop-shadow(0 8px 22px rgba(255,160,50,.4));opacity:0;animation:titleIn 1.6s .5s cubic-bezier(.2,.8,.2,1) forwards}
.title{font-family:'Cinzel','Playfair Display',Georgia,serif;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
  font-size:clamp(34px,10.2vw,150px);line-height:1.02;margin-top:-.08em;filter:drop-shadow(0 10px 26px rgba(255,150,40,.35));
  opacity:0;animation:titleIn 1.6s .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes titleIn{from{opacity:0;transform:translateY(40px) scale(.9);filter:blur(14px)}to{opacity:1;transform:none;filter:drop-shadow(0 8px 22px rgba(255,160,50,.4))}}
.name{font-family:'Great Vibes',cursive;font-size:clamp(30px,6vw,64px);color:#ffe3b0;margin-top:10px;min-height:0;
  text-shadow:0 0 20px rgba(255,170,80,.6);opacity:0;animation:fadeUp 1.4s 1.5s forwards}
.wish{margin-top:18px;min-height:2.6em;font-weight:300;font-size:clamp(14px,2.2vw,22px);letter-spacing:.08em;color:#f3e6ff;
  max-width:760px;text-shadow:0 2px 14px rgba(0,0,0,.6);opacity:0;animation:fadeUp 1.4s 1.9s forwards}
.wish i{display:inline-block;width:2px;height:1.1em;background:#ffd9a0;vertical-align:-.15em;margin-left:3px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

.btn{position:relative;margin-top:30px;padding:17px 40px;border-radius:999px;border:1px solid rgba(255,255,255,.45);color:#fff;
  font-family:'Poppins',sans-serif;font-weight:500;font-size:clamp(14px,2vw,18px);letter-spacing:.18em;text-transform:uppercase;cursor:pointer;
  background:linear-gradient(135deg,rgba(255,214,120,.32),rgba(255,110,160,.26));
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  box-shadow:0 10px 40px rgba(255,120,150,.35),inset 0 1px 0 rgba(255,255,255,.5);overflow:hidden;
  opacity:0;animation:fadeUp 1.2s 2.4s forwards,pulse 2.6s 3.6s ease-in-out infinite;transition:transform .25s}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:sweep 3.2s 3s infinite}
@keyframes sweep{to{left:140%}}
@keyframes pulse{0%,100%{box-shadow:0 10px 40px rgba(255,120,150,.35),inset 0 1px 0 rgba(255,255,255,.5)}50%{box-shadow:0 10px 60px rgba(255,190,90,.7),inset 0 1px 0 rgba(255,255,255,.6)}}
.btn:hover{transform:translateY(-3px) scale(1.04)}
.spark{position:absolute;pointer-events:none;color:#fff3c4;text-shadow:0 0 10px #ffd27a,0 0 24px #ff9d3a;animation:spark 3s ease-in-out infinite;opacity:0}
@keyframes spark{0%,100%{opacity:0;transform:scale(.2) rotate(0)}50%{opacity:1;transform:scale(1) rotate(90deg)}}

/* balloons */
.balloons{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.balloons.back{z-index:2}.balloons.front{z-index:5}
@media (max-width:700px){.balloons.front{z-index:3;opacity:.8}}
#bimg{color:transparent;font-size:0}
.balloon{position:absolute;bottom:-260px;left:var(--x);animation:rise var(--t) linear var(--d) infinite;will-change:transform}
.balloons.back .balloon{filter:blur(1.6px);opacity:.85}
.balloons.front .balloon{filter:blur(.4px)}
.balloon .sway{animation:sway var(--sw) ease-in-out infinite alternate;transform-origin:50% 100%}
.balloon .body{position:relative;width:calc(var(--s)*1px);height:calc(var(--s)*1.22px);border-radius:50% 50% 48% 48%/56% 56% 44% 44%;
  background:
    radial-gradient(ellipse 14% 20% at 30% 24%,rgba(255,255,255,.95),rgba(255,255,255,0) 100%),
    radial-gradient(ellipse 40% 30% at 32% 24%,rgba(255,255,255,.28),transparent 100%),
    radial-gradient(circle at 50% 42%,var(--c1),var(--c2) 68%,var(--c3) 100%);
  box-shadow:inset -10px -16px 26px rgba(0,0,0,.38),inset 8px 10px 18px rgba(255,255,255,.16),0 24px 40px rgba(0,0,0,.28)}
.balloon .body::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:11px;transform:translateX(-50%);
  background:var(--c2);clip-path:polygon(50% 0,100% 100%,0 100%);filter:brightness(.8)}
.balloon .string{width:1.5px;height:150px;margin:9px auto 0;background:linear-gradient(rgba(255,255,255,.7),rgba(255,255,255,.08));
  transform-origin:top center;animation:swing 3s ease-in-out infinite alternate}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(-135vh)}}
@keyframes sway{from{transform:translateX(-22px) rotate(-4deg)}to{transform:translateX(22px) rotate(4deg)}}
@keyframes swing{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}

/* ---------- PAGE 2 ---------- */
#p2{display:flex;flex-direction:column;align-items:center;justify-content:space-between;cursor:pointer;padding:max(2.5vh,14px) 0 max(3vh,20px)}
#p2 .ttl{font-family:'Great Vibes',cursive;font-size:clamp(40px,8vw,92px);line-height:1.1;text-align:center;z-index:3;filter:drop-shadow(0 6px 18px rgba(255,160,50,.45))}
.stageWrap{position:relative;flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
#cakeSvg{width:100%;height:100%;display:block;overflow:visible;opacity:0;transform:translateY(60px) scale(.9);
  transition:opacity 1.2s .3s,transform 1.4s .3s cubic-bezier(.2,.9,.2,1)}
#p2.active #cakeSvg{opacity:1;transform:none}
.hintBar{height:64px;display:flex;align-items:center;justify-content:center;z-index:3}
.hint{font-size:clamp(13px,2vw,19px);font-weight:300;letter-spacing:.2em;text-transform:uppercase;padding:12px 26px;border-radius:999px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  animation:hintPulse 2s ease-in-out infinite;transition:opacity .5s}
@keyframes hintPulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.05);opacity:1}}
.hint.hide{opacity:0;pointer-events:none}
#next2{display:none;margin-top:0;animation:fadeUp 1s forwards,pulse 2.6s 1s ease-in-out infinite;opacity:0}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .18s ease-in-out infinite alternate;transition:opacity .35s,transform .35s}
.flame.out{opacity:0;transform:scale(.1,.3)}
@keyframes flick{0%{transform:scale(1,1) skewX(-3deg)}50%{transform:scale(.94,1.08) skewX(2deg)}100%{transform:scale(1.04,.95) skewX(4deg)}}
.glowc{transition:opacity .8s}
.glowc.out{opacity:0}

/* ---------- PAGE 3 ---------- */
#p3{background:#000;cursor:pointer}
#p3 .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;animation:kenburns 18s ease-out forwards}
@keyframes kenburns{from{transform:scale(1.14)}to{transform:scale(1)}}
#ph{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;
  background:radial-gradient(circle at 30% 20%,#3b1d6e,#140a2b 60%,#07040f);}
#ph .frame{width:min(78vw,520px);aspect-ratio:3/4;max-height:70vh;border:2px dashed rgba(255,225,160,.6);border-radius:22px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(255,255,255,.04);
  box-shadow:0 0 80px rgba(255,170,70,.2) inset}
#ph .ic{font-size:64px}
#ph code{font-family:'Poppins',monospace;font-size:clamp(18px,3vw,26px);color:#ffe3a0;letter-spacing:.08em}
#ph small{opacity:.7;letter-spacing:.12em}
#p3 .shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to top,rgba(0,0,0,.45),transparent 30%)}
#p3 .tap{position:absolute;bottom:max(4vh,24px);left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:.3em;text-transform:uppercase;
  padding:10px 22px;border-radius:999px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.3);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  opacity:0;animation:fadeUpX 1s 2s forwards;white-space:nowrap}
@keyframes fadeUpX{from{opacity:0;transform:translate(-50%,16px)}to{opacity:.9;transform:translate(-50%,0)}}
.ripple{position:fixed;border-radius:50%;pointer-events:none;z-index:70;width:20px;height:20px;margin:-10px 0 0 -10px;
  background:radial-gradient(circle,rgba(255,240,200,.9),rgba(255,180,80,.5) 50%,transparent 70%);animation:rip .6s ease-out forwards}
@keyframes rip{to{transform:scale(60);opacity:0}}
.flash{position:fixed;inset:0;background:#fff;opacity:0;z-index:80;pointer-events:none;transition:opacity .35s}
@media (prefers-reduced-motion:reduce){.balloon,.bulb,.flame{animation-duration:20s}}
</style>
</head>
<body>

<canvas id="bokeh"></canvas>

<!-- ================= PAGE 1 : WISHING ================= -->
<section class="page active" id="p1">
  <div class="lights" id="lights"><svg id="wire"></svg></div>
  <div class="balloons back" id="balloonsBack"></div>
  <div class="hero" id="hero">
    <div class="kicker">&#10022; a day made just for you &#10022;</div>
    <h1 class="script gold">Happy</h1>
    <h1 class="title gold">Birthday</h1>
    <div class="name gold" id="name"></div>
    <p class="wish" id="wish"></p>
    <button class="btn" id="toCake">Let's Celebrate</button>
  </div>
  <div class="balloons front" id="balloonsFront"></div>
</section>

<!-- ================= PAGE 2 : CAKE CUTTING ================= -->
<section class="page" id="p2">
  <div class="ttl gold" id="ttl2">Make a Wish</div>
  <div class="stageWrap">
    <svg id="cakeSvg" viewBox="-10 90 620 450" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="plateGrad" cx="50%" cy="40%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#cfd3da"/><stop offset="1" stop-color="#7d838f"/></radialGradient>
        <linearGradient id="ivory" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffaf2"/><stop offset="1" stop-color="#f1d8ba"/></linearGradient>
        <radialGradient id="topIvory" cx="50%" cy="45%" r="65%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f3dfc4"/></radialGradient>
        <linearGradient id="shadeCyl" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#000" stop-opacity=".34"/><stop offset=".22" stop-color="#000" stop-opacity=".02"/>
          <stop offset=".38" stop-color="#fff" stop-opacity=".22"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/>
          <stop offset=".8" stop-color="#000" stop-opacity=".12"/><stop offset="1" stop-color="#000" stop-opacity=".42"/></linearGradient>
        <linearGradient id="choco" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6a3722"/><stop offset=".5" stop-color="#3b1c10"/><stop offset="1" stop-color="#25100a"/></linearGradient>
        <radialGradient id="chocoTop" cx="42%" cy="38%" r="70%"><stop offset="0" stop-color="#8a4c30"/><stop offset=".45" stop-color="#4a2314"/><stop offset="1" stop-color="#22100a"/></radialGradient>
        <linearGradient id="sponge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6dc9a"/><stop offset="1" stop-color="#dba95a"/></linearGradient>
        <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf6"/><stop offset="1" stop-color="#f1e4cc"/></linearGradient>
        <linearGradient id="jam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e7405a"/><stop offset="1" stop-color="#a3122e"/></linearGradient>
        <linearGradient id="cavShade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".45"/><stop offset=".25" stop-color="#000" stop-opacity="0"/><stop offset=".75" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".45"/></linearGradient>
        <radialGradient id="dollop" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#fff"/><stop offset=".6" stop-color="#fbeedb"/><stop offset="1" stop-color="#d9bd98"/></radialGradient>
        <radialGradient id="pearl" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#ffe9a8"/><stop offset=".75" stop-color="#d49a2a"/><stop offset="1" stop-color="#7a4d08"/></radialGradient>
        <radialGradient id="berry" cx="38%" cy="32%" r="80%"><stop offset="0" stop-color="#ff6b78"/><stop offset=".5" stop-color="#d4152e"/><stop offset="1" stop-color="#6e0414"/></radialGradient>
        <radialGradient id="flameGlow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffb347" stop-opacity=".75"/><stop offset=".4" stop-color="#ff8a1f" stop-opacity=".25"/><stop offset="1" stop-color="#ff6a00" stop-opacity="0"/></radialGradient>
        <radialGradient id="cakeGlow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffb061" stop-opacity=".45"/><stop offset="1" stop-color="#ff7a00" stop-opacity="0"/></radialGradient>
        <linearGradient id="flameBody" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff5a00"/><stop offset=".45" stop-color="#ffae2b"/><stop offset=".85" stop-color="#fff2a8"/><stop offset="1" stop-color="#fff"/></linearGradient>
        <linearGradient id="candleShade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".3"/><stop offset=".35" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></linearGradient>
        <pattern id="stripe" width="9" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(-32)"><rect width="9" height="13" fill="#fff6f0"/><rect width="9" height="6.5" fill="#ff8fab"/></pattern>
        <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8d96a2"/><stop offset=".3" stop-color="#ffffff"/><stop offset=".55" stop-color="#b9c0c9"/><stop offset="1" stop-color="#6f7783"/></linearGradient>
        <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2b1509"/><stop offset=".4" stop-color="#6b3b1d"/><stop offset="1" stop-color="#20100a"/></linearGradient>
        <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
        <filter id="soft3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
        <filter id="grain" x="0" y="0" width="1" height="1">
          <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="4"/>
          <feColorMatrix type="matrix" values="0 0 0 0 .32  0 0 0 0 .18  0 0 0 0 .08  1.7 0 0 0 -.72"/>
        </filter>
        <clipPath id="clipBand"><rect x="330" y="0" width="60" height="800"/></clipPath>
        <clipPath id="clipRest"><rect x="-200" y="0" width="530" height="800"/><rect x="390" y="0" width="800" height="800"/></clipPath>
        <clipPath id="tbClip"><path d="M110,300V450A190,46 0 0 0 490,450V300Z"/></clipPath>
        <clipPath id="ttClip"><path d="M170,220V300A130,32 0 0 0 430,300V220Z"/></clipPath>
        <symbol id="berrySym" viewBox="-20 -22 40 44" overflow="visible">
          <path d="M0,-12 C11,-14 17,-4 12,6 C8,14 3,17 0,19 C-3,17 -8,14 -12,6 C-17,-4 -11,-14 0,-12Z" fill="url(#berry)"/>
          <g fill="#ffe9a0" opacity=".85"><ellipse cx="-6" cy="-3" rx=".9" ry="1.5"/><ellipse cx="2" cy="-5" rx=".9" ry="1.5"/><ellipse cx="8" cy="0" rx=".9" ry="1.5"/>
            <ellipse cx="-3" cy="4" rx=".9" ry="1.5"/><ellipse cx="5" cy="7" rx=".9" ry="1.5"/><ellipse cx="-8" cy="5" rx=".9" ry="1.5"/><ellipse cx="0" cy="12" rx=".9" ry="1.5"/></g>
          <ellipse cx="-5.5" cy="-4" rx="2.6" ry="5.5" fill="#fff" opacity=".38" transform="rotate(18 -5 -4)"/>
          <path d="M0,-12 L-9,-17 L-3,-11 L-6,-20 L0,-13.5 L6,-20 L3,-11 L9,-17Z" fill="#2f8f3c" stroke="#1d6428" stroke-width=".6"/>
        </symbol>
      </defs>

      <!-- floor glow + shadow -->
      <ellipse cx="300" cy="500" rx="300" ry="50" fill="#000" opacity=".45" filter="url(#soft)"/>
      <!-- plate -->
      <ellipse cx="300" cy="470" rx="282" ry="58" fill="url(#plateGrad)"/>
      <ellipse cx="300" cy="466" rx="258" ry="49" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="2"/>
      <ellipse cx="300" cy="468" rx="236" ry="43" fill="#e7e9ee" opacity=".55"/>
      <ellipse cx="300" cy="470" rx="204" ry="46" fill="#000" opacity=".25" filter="url(#soft3)"/>

      <!-- cavity (revealed when slice is removed) -->
      <g id="cavity" clip-path="url(#clipBand)"></g>

      <!-- cake: remaining + slice band -->
      <use href="#cakeBody" id="restUse" clip-path="url(#clipRest)"/>
      <use href="#cakeBody" id="bandUse" clip-path="url(#clipBand)"/>
      <g id="cracks" fill="none" stroke="#5a2f1c" stroke-width="1.3" opacity="0">
        <path d="M330,236 V470"/><path d="M390,236 V470"/>
      </g>

      <!-- candle glow + candles -->
      <circle class="glowc" id="cakeGlow" cx="240" cy="190" r="170" fill="url(#cakeGlow)"/>
      <g id="candles"></g>

      <!-- knife -->
      <g id="knife" style="opacity:0;transform:translate(330px,60px)">
        <rect x="-8" y="-300" width="16" height="72" rx="7" fill="url(#wood)"/>
        <rect x="-9" y="-232" width="18" height="6" rx="2" fill="#d6a43a"/>
        <circle cx="0" cy="-285" r="1.8" fill="#e8c36a"/><circle cx="0" cy="-262" r="1.8" fill="#e8c36a"/>
        <path d="M-8,-226 L8,-226 L8,-14 Q8,-2 0,0 Q-8,-2 -8,-14Z" fill="url(#blade)"/>
        <path d="M3,-224 V-12" stroke="#fff" stroke-opacity=".7" stroke-width="1.2"/>
        <ellipse cx="14" cy="-30" rx="5" ry="40" fill="#000" opacity=".18" filter="url(#soft3)"/>
      </g>

      <!-- slice on plate -->
      <g id="slicePlate" style="opacity:0;transform:translate(690px,470px) scale(.5)">
        <ellipse cx="0" cy="8" rx="122" ry="30" fill="#000" opacity=".4" filter="url(#soft)"/>

(function(){

async function cut(){

  tweenVB(portrait?[-10,90,620,640]:[-10,90,830,450],1600);
  await sleep(700);
  anim(plate,[{opacity:0,transform:`translate(${pos[0]}px,${pos[1]-60}px) scale(.45)`},{opacity:1,transform:`translate(${pos[0]}px,${pos[1]+6}px) scale(1.06)`,offset:.7},
    {opacity:1,transform:`translate(${pos[0]}px,${pos[1]}px) scale(1)`}],{duration:900,easing:'cubic-bezier(.2,.9,.3,1)'});
  CF.big();
  $('#ttl2').textContent='Happy Birthday!';
  await sleep(1100);
  CF.burst(innerWidth/2,innerHeight*.45,100,Math.PI*2,-Math.PI/2,[6,16]);
  state=2;busy=false;
  $('#hint2').style.display='none';const n=$('#next2');n.style.display='inline-block';
}
$('#p2').addEventListener('click',e=>{
  if(!cakeStarted||busy||state===2)return;
  if(state===0)blow();else if(state===1)cut();
});
$('#next2').addEventListener('click',e=>{e.stopPropagation();go3()});
let p3ready=false,leaving=false;
function go3(){
  show('#p3');setTimeout(()=>{p3ready=true},900);
  CF.burst(innerWidth/2,innerHeight*.5,70,Math.PI*2,-Math.PI/2,[5,12]);
}

/* ---------- page 3 : photo (tap anywhere -> redirect) ---------- */
const img=$('#bimg'),ph=$('#ph');
function noPhoto(){img.style.display='none';ph.style.display='flex'}
img.addEventListener('error',noPhoto);
if(img.complete&&img.naturalWidth===0)noPhoto();
$('#p3').addEventListener('click',e=>{
  if(!p3ready||leaving)return;leaving=true;
  const r=document.createElement('div');r.className='ripple';r.style.left=e.clientX+'px';r.style.top=e.clientY+'px';document.body.appendChild(r);
  $('#flash').style.opacity=.9;
  setTimeout(()=>{window.location.href=REDIRECT_URL},380);
});
</script>
