<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Happy Birthday</title>
<meta name="theme-color" content="#0a0618">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Great+Vibes&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --gold1:#8a5a12; --gold2:#f9e08b; --gold3:#fff7cf; --gold4:#d9a52b;
  --redirect-url:"https://sankha1769.github.io/Happy-Birthday-/";
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0618;touch-action:manipulation;
  font-family:'Poppins',system-ui,sans-serif;color:#fff;-webkit-user-select:none;user-select:none}
html,body{height:100dvh}
body{
  background:
    radial-gradient(70vmax 60vmax at 50% 42%, rgba(255,110,170,.42), transparent 66%),
    radial-gradient(55vmax 45vmax at 6% 96%, rgba(255,176,60,.34), transparent 62%),
    radial-gradient(55vmax 45vmax at 96% 90%, rgba(40,205,225,.30), transparent 62%),
    radial-gradient(50vmax 40vmax at 90% 8%, rgba(150,110,255,.35), transparent 62%),
    linear-gradient(#3a1470 0%, #701a78 46%, #b82672 100%);
}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:60;
  background:radial-gradient(ellipse at center, transparent 62%, rgba(30,0,40,.38) 100%)}
/* party layer */
#party{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#party .beams{position:absolute;left:50%;top:-6%;width:170vmax;height:140vmax;margin-left:-85vmax;transform-origin:50% 0;mix-blend-mode:screen;
  background:conic-gradient(from 180deg at 50% 0%,transparent 0 6%,rgba(255,255,255,.13) 8% 10.5%,transparent 13% 22%,rgba(255,214,120,.16) 24% 26.5%,transparent 29% 38%,rgba(120,235,255,.13) 40% 42.5%,transparent 45% 100%);
  animation:beamA 13s ease-in-out infinite alternate}
#party .beams.b2{background:conic-gradient(from 180deg at 50% 0%,transparent 0 12%,rgba(255,140,200,.14) 14% 16.5%,transparent 19% 30%,rgba(255,255,255,.1) 32% 34%,transparent 36% 52%,rgba(190,150,255,.13) 54% 56.5%,transparent 59% 100%);
  animation:beamB 17s ease-in-out infinite alternate}
@keyframes beamA{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
@keyframes beamB{from{transform:rotate(8deg)}to{transform:rotate(-10deg)}}
#party .dots{position:absolute;inset:-256px;background-size:256px 256px;opacity:.75;animation:drift 38s linear infinite}
@keyframes drift{to{transform:translate(256px,256px)}}
#party svg{position:absolute;left:0;top:0;overflow:visible}
#party .flag,#party .stream{transform-box:fill-box;transform-origin:50% 0;animation:flagSwing var(--sd,3.4s) ease-in-out var(--dl,0s) infinite alternate}
#party .stream{transform-origin:50% 0;animation-name:streamSway}
@keyframes flagSwing{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
@keyframes streamSway{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
#p1 .lights{display:none}
canvas#bokeh{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
canvas#confetti{position:fixed;inset:0;z-index:55;pointer-events:none}

/* ---------- pages ---------- */
.page{position:fixed;inset:0;z-index:1;opacity:0;visibility:hidden;transform:scale(.94);filter:blur(10px);
  transition:opacity .9s ease,transform 1s cubic-bezier(.2,.8,.2,1),filter .9s ease,visibility 0s linear .9s;overflow:hidden}
.page.active{opacity:1;visibility:visible;transform:none;filter:none;transition-delay:0s;z-index:2}
.page.leaving{opacity:0;visibility:visible;transform:scale(1.12);filter:blur(12px);z-index:1}

/* ---------- PAGE 1 ---------- */
.lights{position:absolute;top:0;left:0;right:0;height:80px;z-index:6;pointer-events:none}
.lights svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.bulb{position:absolute;width:12px;height:17px;border-radius:50% 50% 45% 45%;transform:translate(-50%,0);
  animation:twinkle 2.4s ease-in-out infinite}
.bulb::before{content:"";position:absolute;left:50%;top:-5px;width:6px;height:6px;background:#555;transform:translateX(-50%);border-radius:1px}
@keyframes twinkle{0%,100%{opacity:1;filter:brightness(1.25)}50%{opacity:.55;filter:brightness(.8)}}

.hero{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:4;padding:var(--bunt-h,0px) 20px 0}
.kicker{font-size:clamp(11px,1.6vw,16px);letter-spacing:.5em;text-transform:uppercase;color:#ffd9a0;opacity:0;
  animation:fadeUp 1.4s .3s forwards;text-shadow:0 0 14px rgba(255,190,100,.6);margin-bottom:6px}
.gold{background:linear-gradient(100deg,#8a5a12 0%,#f9e08b 16%,#fff7cf 26%,#d9a52b 38%,#8a5a12 52%,#ffe9a0 68%,#fff7cf 76%,#b9791a 100%);
  background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  animation:shine 6s linear infinite}
@keyframes shine{to{background-position:-260% 0}}
.script{font-family:'Great Vibes','Brush Script MT',cursive;font-weight:400;font-size:clamp(46px,min(14vw,23vh),170px);line-height:1;
  filter:drop-shadow(0 8px 22px rgba(255,160,50,.4));opacity:0;animation:titleIn 1.6s .5s cubic-bezier(.2,.8,.2,1) forwards}
.title{font-family:'Cinzel','Playfair Display',Georgia,serif;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
  font-size:clamp(28px,min(10.2vw,15vh),150px);line-height:1.02;margin-top:-.08em;filter:drop-shadow(0 10px 26px rgba(255,150,40,.35));
  opacity:0;animation:titleIn 1.6s .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes titleIn{from{opacity:0;transform:translateY(40px) scale(.9);filter:blur(14px)}to{opacity:1;transform:none;filter:drop-shadow(0 8px 22px rgba(255,160,50,.4))}}
.name{font-family:'Great Vibes',cursive;font-size:clamp(30px,6vw,64px);color:#ffe3b0;margin-top:10px;min-height:0;
  text-shadow:0 0 20px rgba(255,170,80,.6);opacity:0;animation:fadeUp 1.4s 1.5s forwards}
.wish{margin-top:18px;min-height:2.6em;font-weight:300;font-size:clamp(14px,2.2vw,22px);letter-spacing:.08em;color:#f3e6ff;
  max-width:760px;text-shadow:0 2px 14px rgba(0,0,0,.6);opacity:0;animation:fadeUp 1.4s 1.9s forwards}
.wish i{display:inline-block;width:2px;height:1.1em;background:#ffd9a0;vertical-align:-.15em;margin-left:3px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

.btn{position:relative;margin-top:30px;padding:17px 40px;border-radius:999px;border:1px solid rgba(255,255,255,.45);color:#fff;
  font-family:'Poppins',sans-serif;font-weight:500;font-size:clamp(14px,2vw,18px);letter-spacing:.18em;text-transform:uppercase;cursor:pointer;
  background:linear-gradient(135deg,rgba(255,214,120,.32),rgba(255,110,160,.26));
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  box-shadow:0 10px 40px rgba(255,120,150,.35),inset 0 1px 0 rgba(255,255,255,.5);overflow:hidden;
  opacity:0;animation:fadeUp 1.2s 2.4s forwards,pulse 2.6s 3.6s ease-in-out infinite;transition:transform .25s}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:sweep 3.2s 3s infinite}
@keyframes sweep{to{left:140%}}
@keyframes pulse{0%,100%{box-shadow:0 10px 40px rgba(255,120,150,.35),inset 0 1px 0 rgba(255,255,255,.5)}50%{box-shadow:0 10px 60px rgba(255,190,90,.7),inset 0 1px 0 rgba(255,255,255,.6)}}
.btn:hover{transform:translateY(-3px) scale(1.04)}
.spark{position:absolute;pointer-events:none;color:#fff3c4;text-shadow:0 0 10px #ffd27a,0 0 24px #ff9d3a;animation:spark 3s ease-in-out infinite;opacity:0}
@keyframes spark{0%,100%{opacity:0;transform:scale(.2) rotate(0)}50%{opacity:1;transform:scale(1) rotate(90deg)}}

/* balloons */
.balloons{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.balloons.back{z-index:2}.balloons.front{z-index:3;opacity:.85}
#bimg{color:transparent;font-size:0}
.balloon{position:absolute;bottom:-260px;left:var(--x);animation:rise var(--t) linear var(--d) infinite;will-change:transform}
.balloons.back .balloon{filter:blur(1.6px);opacity:.85}
.balloons.front .balloon{filter:blur(.4px)}
.balloon .sway{animation:sway var(--sw) ease-in-out infinite alternate;transform-origin:50% 100%}
.balloon .body{position:relative;width:calc(var(--s)*1px);height:calc(var(--s)*1.22px);border-radius:50% 50% 48% 48%/56% 56% 44% 44%;
  background:
    radial-gradient(ellipse 14% 20% at 30% 24%,rgba(255,255,255,.95),rgba(255,255,255,0) 100%),
    radial-gradient(ellipse 40% 30% at 32% 24%,rgba(255,255,255,.28),transparent 100%),
    radial-gradient(circle at 50% 42%,var(--c1),var(--c2) 68%,var(--c3) 100%);
  box-shadow:inset -10px -16px 26px rgba(0,0,0,.38),inset 8px 10px 18px rgba(255,255,255,.16),0 24px 40px rgba(0,0,0,.28)}
.balloon .body::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:11px;transform:translateX(-50%);
  background:var(--c2);clip-path:polygon(50% 0,100% 100%,0 100%);filter:brightness(.8)}
.balloon .string{width:1.5px;height:150px;margin:9px auto 0;background:linear-gradient(rgba(255,255,255,.7),rgba(255,255,255,.08));
  transform-origin:top center;animation:swing 3s ease-in-out infinite alternate}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(-135vh)}}
@keyframes sway{from{transform:translateX(-22px) rotate(-4deg)}to{transform:translateX(22px) rotate(4deg)}}
@keyframes swing{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}

/* ---------- PAGE 2 ---------- */
#p2{display:flex;flex-direction:column;align-items:center;justify-content:space-between;cursor:pointer;padding:calc(var(--bunt-h,0px) + 4px) 0 max(3vh,20px)}
#p2 .ttl{font-family:'Great Vibes',cursive;font-size:clamp(34px,min(8vw,11vh),92px);line-height:1.1;text-align:center;z-index:3;filter:drop-shadow(0 6px 18px rgba(255,160,50,.45))}
.stageWrap{position:relative;flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
#cake3d{width:100%;height:100%;display:block;opacity:0;transform:translateY(30px);transition:opacity 1.2s .3s,transform 1.4s .3s cubic-bezier(.2,.9,.2,1)}
#p2.active #cake3d{opacity:1;transform:none}
.hintBar{height:64px;display:flex;align-items:center;justify-content:center;z-index:3}
.hint{font-size:clamp(13px,2vw,19px);font-weight:300;letter-spacing:.2em;text-transform:uppercase;padding:12px 26px;border-radius:999px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  animation:hintPulse 2s ease-in-out infinite;transition:opacity .5s}
@keyframes hintPulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.05);opacity:1}}
.hint.hide{opacity:0;pointer-events:none}
#next2{display:none;margin-top:0;animation:fadeUp 1s forwards,pulse 2.6s 1s ease-in-out infinite;opacity:0}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .18s ease-in-out infinite alternate;transition:opacity .35s,transform .35s}
.flame.out{opacity:0;transform:scale(.1,.3)}
@keyframes flick{0%{transform:scale(1,1) skewX(-3deg)}50%{transform:scale(.94,1.08) skewX(2deg)}100%{transform:scale(1.04,.95) skewX(4deg)}}
.glowc{transition:opacity .8s}
.glowc.out{opacity:0}

/* ---------- PAGE 3 ---------- */
#p3{background:#000;cursor:pointer}
#p3 .photo{position:absolute;inset:0;width:100%;height:100%;object-position:center}
#p3 .bgblur{object-fit:cover;filter:blur(30px) saturate(1.05) brightness(.9);transform:scale(1.18)}
#p3 .fg{object-fit:contain;animation:photoIn 1.6s cubic-bezier(.2,.8,.2,1) both}
@keyframes photoIn{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:scale(1)}}
#ph{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;
  background:radial-gradient(circle at 30% 20%,#3b1d6e,#140a2b 60%,#07040f);}
#ph .frame{width:min(78vw,520px);aspect-ratio:3/4;max-height:70vh;border:2px dashed rgba(255,225,160,.6);border-radius:22px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(255,255,255,.04);
  box-shadow:0 0 80px rgba(255,170,70,.2) inset}
#ph .ic{font-size:64px}
#ph code{font-family:'Poppins',monospace;font-size:clamp(18px,3vw,26px);color:#ffe3a0;letter-spacing:.08em}
#ph small{opacity:.7;letter-spacing:.12em}
#p3 .shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to top,rgba(0,0,0,.45),transparent 30%)}
#p3 .tap{position:absolute;bottom:max(4vh,24px);left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:.3em;text-transform:uppercase;
  padding:10px 22px;border-radius:999px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.3);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  opacity:0;animation:fadeUpX 1s 2s forwards;white-space:nowrap}
@keyframes fadeUpX{from{opacity:0;transform:translate(-50%,16px)}to{opacity:.9;transform:translate(-50%,0)}}
.ripple{position:fixed;border-radius:50%;pointer-events:none;z-index:70;width:20px;height:20px;margin:-10px 0 0 -10px;
  background:radial-gradient(circle,rgba(255,240,200,.9),rgba(255,180,80,.5) 50%,transparent 70%);animation:rip .6s ease-out forwards}
@keyframes rip{to{transform:scale(60);opacity:0}}
.flash{position:fixed;inset:0;background:#fff;opacity:0;z-index:80;pointer-events:none;transition:opacity .35s}
/* ---------- countdown page ---------- */
#p0::before{content:"";position:absolute;inset:0;z-index:0;background:radial-gradient(ellipse at 50% 42%,rgba(60,14,96,.25),rgba(18,2,38,.72) 100%)}
.cdwrap{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:var(--bunt-h,0px) 16px 0;gap:clamp(4px,1.2vh,14px)}
.gift{width:clamp(78px,min(22vw,16vh),210px);height:auto;overflow:visible;filter:drop-shadow(0 18px 34px rgba(255,90,170,.35));
  opacity:0;animation:fadeUp 1.2s .1s forwards,bob 3.4s 1.3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.glid{transform-box:fill-box;transform-origin:50% 100%;animation:lid 4.6s 2s ease-in-out infinite}
@keyframes lid{0%,58%,100%{transform:translateY(0) rotate(0)}64%{transform:translateY(-9px) rotate(-4deg)}70%{transform:translateY(-4px) rotate(3.5deg)}76%{transform:translateY(-7px) rotate(-2.5deg)}84%{transform:translateY(0) rotate(0)}}
.gshadow{transform-box:fill-box;transform-origin:50% 50%;animation:gsh 3.4s 1.3s ease-in-out infinite}
@keyframes gsh{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(.86);opacity:.32}}
.sp{transform-box:fill-box;transform-origin:50% 50%;animation:twk 2.6s ease-in-out infinite;opacity:0}
.s2{animation-delay:.5s}.s3{animation-delay:1s}.s4{animation-delay:1.5s}.s5{animation-delay:.9s}.s6{animation-delay:1.9s}
@keyframes twk{0%,100%{opacity:0;transform:scale(.2) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(45deg)}}
.cdk{animation-delay:.5s}
.cdt{font-size:clamp(36px,min(11vw,11vh),120px)!important;animation-delay:.7s!important}
.cd-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(8px,2vw,24px);width:min(92vw,840px);margin-top:clamp(8px,2vh,22px);
  opacity:0;animation:fadeUp 1.2s 1.1s forwards}
.cd{position:relative;border-radius:clamp(14px,2.2vw,28px);padding:clamp(10px,2.4vh,30px) 4px clamp(8px,1.8vh,20px);
  background:linear-gradient(160deg,rgba(255,255,255,.2),rgba(255,255,255,.05));
  -webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);
  box-shadow:0 22px 60px rgba(20,0,40,.5),inset 0 1px 0 rgba(255,255,255,.4),inset 0 -20px 40px rgba(255,120,190,.08)}
.cd::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;
  background:linear-gradient(150deg,rgba(255,238,184,.95),rgba(255,150,200,.18) 42%,rgba(255,238,184,.7));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);mask-composite:exclude}
.num{display:block;font-family:'Cinzel','Playfair Display',Georgia,serif;font-weight:800;font-size:clamp(28px,min(9.4vw,11vh),96px);line-height:1.05;
  font-variant-numeric:tabular-nums lining-nums;letter-spacing:.02em;
  background:linear-gradient(180deg,#fffbe3 0%,#ffe08a 38%,#e0a232 70%,#fff0b0 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 6px 16px rgba(255,170,60,.4))}
.num.flip{animation:flip .6s cubic-bezier(.2,.9,.3,1)}
@keyframes flip{0%{transform:translateY(-38%) rotateX(75deg) scale(.9);opacity:0;filter:blur(5px)}60%{opacity:1}100%{transform:none;opacity:1}}
.lab{display:block;margin-top:clamp(2px,.8vh,8px);font-weight:300;text-transform:uppercase;letter-spacing:.3em;padding-left:.3em;color:#ffe3bd;font-size:clamp(8px,1.5vw,13px)}
.bar{margin:clamp(8px,1.6vh,14px) auto 0;width:58%;height:3px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
.bar i{display:block;height:100%;width:var(--w,0%);border-radius:3px;background:linear-gradient(90deg,#ffd27a,#ff7ab6);box-shadow:0 0 10px #ffb86b;transition:width .95s linear}
.when{position:relative;margin-top:clamp(12px,3vh,30px);padding:clamp(8px,1.4vh,13px) clamp(16px,3vw,30px);border-radius:999px;overflow:hidden;
  border:1px solid rgba(255,255,255,.38);background:rgba(255,255,255,.08);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  letter-spacing:.26em;text-transform:uppercase;font-weight:400;font-size:clamp(9px,1.7vw,15px);color:#ffe9c4;white-space:nowrap;
  box-shadow:0 10px 36px rgba(255,120,170,.28);opacity:0;animation:fadeUp 1.2s 1.6s forwards}
.when span{color:#ffd27a;margin:0 .5em}
.when::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);animation:sweep 3.6s 2.5s infinite}
.itstime .cdt{animation:none!important;transform:scale(1.08)}
.itstime .gift{animation:giftPop .9s ease-out}
@keyframes giftPop{0%{transform:scale(1)}40%{transform:scale(1.25) rotate(-6deg)}100%{transform:scale(1) rotate(0)}}
@media (max-height:520px){
  .gift{display:none}.cdk{display:none}.cd{padding-top:10px}.when{margin-top:10px}
}
@media (max-height:520px){
  .kicker{display:none}.wish{margin-top:8px;min-height:1.6em}.btn{margin-top:12px;padding:11px 28px}.name{margin-top:2px}
  .hintBar{height:50px}.hint{padding:8px 18px}
}
@media (prefers-reduced-motion:reduce){.balloon,.bulb,.flame{animation-duration:20s}}
</style>
</head>
<body>

<div id="party"><div class="beams"></div><div class="beams b2"></div><div class="dots" id="pdots"></div><svg id="stream"></svg><svg id="bunt"></svg></div>
<canvas id="bokeh"></canvas>

<!-- ================= PAGE 1 : WISHING ================= -->
<!-- ================= PAGE 0 : COUNTDOWN (gate) ================= -->
<section class="page active" id="p0">
  <div class="cdwrap">
    <svg class="gift" viewBox="0 0 200 200" aria-hidden="true">
      <defs>
        <linearGradient id="gBody" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5aa5"/><stop offset=".6" stop-color="#d81b72"/><stop offset="1" stop-color="#8e0f4f"/></linearGradient>
        <linearGradient id="gLid" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7fb8"/><stop offset=".6" stop-color="#e8307f"/><stop offset="1" stop-color="#a4125a"/></linearGradient>
        <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff2b8"/><stop offset=".45" stop-color="#f3c04e"/><stop offset="1" stop-color="#a8701a"/></linearGradient>
        <filter id="gBlur"><feGaussianBlur stdDeviation="5"/></filter>
        <path id="spk" d="M0,-9 Q1.4,-1.4 9,0 Q1.4,1.4 0,9 Q-1.4,1.4 -9,0 Q-1.4,-1.4 0,-9Z"/>
      </defs>
      <ellipse class="gshadow" cx="100" cy="186" rx="66" ry="9" fill="#12001f" opacity=".5" filter="url(#gBlur)"/>
      <rect x="40" y="98" width="120" height="86" rx="7" fill="url(#gBody)"/>

/* ===== procedural textures ===== */
function cutCanvas(){

  const ys=[0];L.forEach(l=>ys.push(ys[ys.length-1]+l[1]*Hh));

  L.forEach(([k],i)=>{

    gr.addColorStop(0,c4[0]);gr.addColorStop(.14,c4[1]);gr.addColorStop(.86,c4[2]);gr.addColorStop(1,c4[3]);

    else if(k==='cream'&&r()<.2){g.fillStyle=`rgba(230,205,165,${.08+r()*.12})`;g.fillRect(x,y,1+r()*5,1)}
    else if(k==='jam'&&r()<.35){g.fillStyle=`rgba(255,${110+r()*50|0},130,${.12+r()*.2})`;g.beginPath();g.ellipse(x,y,.8+r()*2,.6+r()*1.2,r()*3,0,6.3);g.fill()}

    g.fillStyle='rgba(255,240,200,.38)';g.beginPath();g.ellipse(x+.5,y+ry*.75,rx*.85,ry*.35,0,0,6.3);g.fill();

  const fg=g.createLinearGradient(sx,0,W,0);fg.addColorStop(0,'#f3e2c6');fg.addColorStop(.35,'#fffaf0');fg.addColorStop(1,'#fff1db');g.fillStyle=fg;g.fill();
  // ganache sheen

}
function frostCanvas(){
  const W=1024,Hh=512,c=cnv(W,Hh),g=c.getContext('2d'),r=seeded(5);
  const gr=g.createLinearGradient(0,0,0,Hh);gr.addColorStop(0,'#fff9ee');gr.addColorStop(.5,'#fff3e0');gr.addColorStop(1,'#f3e0c2');g.fillStyle=gr;g.fillRect(0,0,W,Hh);
  for(let i=0;i<220;i++){const x=r()*W,y=r()*Hh*.5,l=Hh*(.3+r()*.7),w=2+r()*8;
    g.fillStyle=r()<.55?`rgba(255,255,255,${.05+r()*.1})`:`rgba(196,150,96,${.015+r()*.035})`;
    for(const o of[-W,0,W])g.fillRect(x+o,y,w,l)}
  for(let i=0;i<40;i++){const y=r()*Hh;g.fillStyle=r()<.5?`rgba(255,255,255,${.03+r()*.05})`:`rgba(190,140,90,${.015+r()*.03})`;g.fillRect(0,y,W,2+r()*5)}

  return c;
}
function berryCanvas(){
  const c=cnv(256,256),g=c.getContext('2d'),r=seeded(9);
  const gr=g.createLinearGradient(0,0,0,256);gr.addColorStop(0,'#c60f2a');gr.addColorStop(.5,'#e3213f');gr.addColorStop(1,'#f0485a');g.fillStyle=gr;g.fillRect(0,0,256,256);
  for(let row=0;row<18;row++)for(let col=0;col<22;col++){
    const x=(col+(row%2?.5:0))*(256/22),y=row*(256/18)+3;
    g.fillStyle='rgba(120,0,15,.35)';g.beginPath();g.ellipse(x,y+1,2.6,3.6,0,0,6.3);g.fill();
    g.fillStyle='#f7d77e';g.beginPath();g.ellipse(x,y,1.6,2.5,0,0,6.3);g.fill()}
  noiseCanvas(c,10,2);return c;
}
function candleCanvas(){
  const c=cnv(64,256),g=c.getContext('2d');g.fillStyle='#fff7f0';g.fillRect(0,0,64,256);
  g.fillStyle='#ff7ba4';for(let i=-4;i<12;i++){g.beginPath();g.moveTo(0,i*32);g.lineTo(64,i*32-24);g.lineTo(64,i*32-8);g.lineTo(0,i*32+16);g.closePath();g.fill()}

}
function flameCanvas(){
  const w=128,h=256,c=cnv(w,h),g=c.getContext('2d'),id=g.createImageData(w,h),d=id.data;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const u=(x-w/2)/(w/2),v=y/h;
    const hw=.7*Math.pow(Math.sin(Math.PI*clamp((v-.02)/.96,0,1)),.8)*(.3+.7*v);
    let i=hw>0?clamp(1-Math.abs(u)/hw,0,1):0;i=Math.pow(i,1.25);
    const k=(y*w+x)*4;
    let r=255,gg=lerp(105,245,Math.pow(i,1.3)),b=lerp(15,200,Math.pow(i,3));
    if(v>.72){const m=clamp((v-.72)/.22,0,1)*.75*(1-i*.25);r=lerp(r,95,m);gg=lerp(gg,135,m);b=lerp(b,255,m)}
    d[k]=r;d[k+1]=gg;d[k+2]=b;d[k+3]=Math.pow(i,.8)*255;

}
function radialCanvas(stops,s=128){const c=cnv(s,s),g=c.getContext('2d'),gr=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);stops.forEach(([o,col])=>gr.addColorStop(o,col));g.fillStyle=gr;g.fillRect(0,0,s,s);return c}

/* ===== environment (soft-boxes for reflections) ===== */
function makeEnv(renderer){
  const s=new THREE.Scene();
  s.add(new THREE.Mesh(new THREE.SphereGeometry(60,32,16),new THREE.MeshBasicMaterial({color:0x5a5470,side:THREE.BackSide})));
  const box=(w,h,col,k,pos)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:new THREE.Color(col).multiplyScalar(k),side:THREE.DoubleSide}));m.position.set(...pos);m.lookAt(0,0,0);s.add(m)};
  box(30,18,0xfff1dc,7,[-22,26,18]);
  box(18,26,0xa9c1ff,3.2,[30,10,-14]);
  box(40,10,0xffb070,2.2,[0,-3,30]);
  box(14,14,0xffe3c0,4,[8,30,-6]);
  box(3,44,0xffffff,14,[-34,6,6]);box(2.5,44,0xfff4e0,10,[14,8,34]);box(2.5,40,0xdfe8ff,9,[34,6,10]);
  const pm=new THREE.PMREMGenerator(renderer),rt=pm.fromScene(s,.03);pm.dispose();return rt.texture;
}

/* ===== build the whole scene ===== */
function buildScene(){

  const candleLight=new THREE.PointLight(0xff9a3c,1.8,7,2);scene.add(candleLight);

  /* materials */
  const frostC=frostCanvas(),cutC=cutCanvas(),berryC=berryCanvas();
  const M={
    frost:new THREE.MeshStandardMaterial({map:tex(frostC,true),bumpMap:texL(frostC,true),bumpScale:.25,roughness:.62,envMapIntensity:.4}),
    cut:new THREE.MeshStandardMaterial({map:tex(cutC),bumpMap:texL(cutC),bumpScale:1.5,roughness:.82,side:THREE.DoubleSide,envMapIntensity:.3}),
    ganache:new THREE.MeshPhysicalMaterial({color:0x2c140b,roughness:.2,clearcoat:1,clearcoatRoughness:.12,envMapIntensity:1}),

    gold:new THREE.MeshStandardMaterial({color:0xf0c25a,metalness:1,roughness:.22,envMapIntensity:1.3}),
    berry:new THREE.MeshPhysicalMaterial({map:tex(berryC,true),bumpMap:texL(berryC,true),bumpScale:.6,roughness:.38,clearcoat:.7,clearcoatRoughness:.25,envMapIntensity:.9}),

    porcelain:new THREE.MeshPhysicalMaterial({color:0xf9f6f1,roughness:.14,clearcoat:1,clearcoatRoughness:.06,envMapIntensity:1}),

  /* ground */
  const ground=new THREE.Mesh(new THREE.CircleGeometry(14,64),new THREE.ShadowMaterial({color:0x2a0640,opacity:.42}));
  ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

  /* plates */
  function makePlate(){
    const pts=[[0,0],[1,0],[1.05,.03],[2.1,.06],[2.3,.13],[2.34,.18],[2.29,.18],[2.22,.12],[1.9,.1],[0,.1]].map(p=>new THREE.Vector2(p[0],p[1]));
    const g=new THREE.Group();
    const body=new THREE.Mesh(new THREE.LatheGeometry(new THREE.SplineCurve(pts).getPoints(60).map(p=>new THREE.Vector2(Math.max(0,p.x),p.y)),96),M.porcelain);
    body.material.side=THREE.DoubleSide;body.castShadow=body.receiveShadow=true;g.add(body);
    const ring=new THREE.Mesh(new THREE.TorusGeometry(2.3,.024,12,128),M.gold);ring.rotation.x=Math.PI/2;ring.position.y=.178;g.add(ring);
    const ring2=new THREE.Mesh(new THREE.TorusGeometry(1.85,.012,8,128),M.gold);ring2.rotation.x=Math.PI/2;ring2.position.y=.101;g.add(ring2);
    return g;
  }
  const plate1=makePlate();scene.add(plate1);
  const plate2=makePlate();plate2.visible=false;scene.add(plate2);

  /* ----- cake pieces ----- */
  const cakeRoot=new THREE.Group();cakeRoot.position.y=PLATE_TOP;scene.add(cakeRoot);
  const mainG=new THREE.Group(),sliceG=new THREE.Group();cakeRoot.add(mainG,sliceG);

  const norm=a=>{a%=Math.PI*2;if(a>Math.PI)a-=Math.PI*2;if(a<=-Math.PI)a+=Math.PI*2;return a};
  const inSlice=a=>Math.abs(norm(a))<WEDGE/2;
  const hostOf=a=>inSlice(a)?sliceG:mainG;
  const shadow=m=>{m.castShadow=true;m.receiveShadow=true;return m};

  function sector(r,h,t0,len,mats){
    const seg=Math.max(3,Math.ceil(len/(Math.PI*2)*140));
    const g=new THREE.CylinderGeometry(r,r,h,seg,1,false,t0,len);
    const uv=g.attributes.uv,n=(seg+1)*2;
    for(let i=0;i<n;i++)uv.setX(i,(t0+uv.getX(i)*len)/(Math.PI*2)*SIDE_REP);
    g.translate(0,h/2,0);return shadow(new THREE.Mesh(g,mats));
  }
  function band(r,y0,h,t0,len){
    const seg=Math.max(3,Math.ceil(len/(Math.PI*2)*140));
    const g=new THREE.CylinderGeometry(r,r,h,seg,1,true,t0,len);g.translate(0,y0+h/2,0);
    const m=new THREE.Mesh(g,M.ganache);m.material=M.ganache.clone();m.material.side=THREE.DoubleSide;return shadow(m);
  }
  function face(theta){

  }
  const topMat=M.ganache,botMat=M.cream;
  const t0m=WEDGE/2,lenm=Math.PI*2-WEDGE;
  mainG.add(sector(R,H,t0m,lenm,[M.frost,topMat,botMat]),face(WEDGE/2),face(-WEDGE/2),band(R+.012,H-.12,.135,t0m,lenm));
  sliceG.add(sector(R,H,-WEDGE/2,WEDGE,[M.frost,topMat,botMat]),face(WEDGE/2),face(-WEDGE/2),band(R+.012,H-.12,.135,-WEDGE/2,WEDGE));

  /* chocolate drips */
  {
    const r=seeded(33),geo=new THREE.SphereGeometry(1,14,10);
    let a=.12;
    while(a<Math.PI*2){
      const th=a;a+=.16+r()*.2;
      const b=norm(th);if(Math.abs(Math.abs(b)-WEDGE/2)<.07)continue;
      const len=.16+r()*.42,wd=.045+r()*.04;
      const m=shadow(new THREE.Mesh(geo,M.ganache));
      m.scale.set(wd,len/2,.03);m.position.set((R+.006)*Math.sin(th),H-len/2+.02,(R+.006)*Math.cos(th));m.rotation.y=th;
      hostOf(th).add(m);
    }
  }
  /* piped cream rosettes (top + base) */
  {
    const prof=[[0,0],[.12,0],[.145,.035],[.125,.085],[.13,.105],[.105,.135],[.095,.165],[.07,.2],[.04,.235],[.012,.265],[0,.27]].map(p=>new THREE.Vector2(p[0],p[1]));
    const geo=new THREE.LatheGeometry(new THREE.SplineCurve(prof).getPoints(26),18);
    const N=32,s=Math.PI*2/N;
    for(let k=0;k<N;k++){
      const th=(k+.5)*s,host=hostOf(th);
      const m1=shadow(new THREE.Mesh(geo,M.cream));m1.position.set((R-.15)*Math.sin(th),H-.01,(R-.15)*Math.cos(th));m1.rotation.y=k;host.add(m1);
      const m2=shadow(new THREE.Mesh(geo,M.cream));m2.scale.setScalar(1.3);m2.position.set((R+.0)*Math.sin(th),0,(R+.0)*Math.cos(th));m2.rotation.y=k;host.add(m2);
      const pe=shadow(new THREE.Mesh(new THREE.SphereGeometry(.032,12,10),M.gold));pe.position.set((R-.42)*Math.sin(th+s/2),H+.02,(R-.42)*Math.cos(th+s/2));
      if(Math.abs(norm(th+s/2))>.04&&Math.abs(Math.abs(norm(th+s/2))-WEDGE/2)>.04)hostOf(th+s/2).add(pe);
    }
  }
  /* strawberries */
  {
    const pts=new THREE.SplineCurve([[0,0],[.035,.015],[.09,.07],[.14,.15],[.17,.24],[.165,.31],[.13,.36],[.07,.385],[0,.39]].map(p=>new THREE.Vector2(p[0],p[1]))).getPoints(30);
    const bg=new THREE.LatheGeometry(pts,26);
    const q=new THREE.Quaternion(),down=new THREE.Vector3(0,-1,0);
    [0,45,90,135,180,225,270,315].forEach((deg,i)=>{
      const th=deg*Math.PI/180,gp=new THREE.Group();
      gp.add(shadow(new THREE.Mesh(bg,M.berry)));
      for(let l=0;l<6;l++){const a=l/6*Math.PI*2,lf=new THREE.Mesh(new THREE.SphereGeometry(.055,10,8),M.leaf);
        lf.rotation.order='YXZ';lf.scale.set(1,.18,2.4);lf.position.set(Math.cos(a)*.085,.385,Math.sin(a)*.085);lf.rotation.y=Math.PI/2-a;lf.rotation.x=.45;gp.add(lf)}
      const st=new THREE.Mesh(new THREE.CylinderGeometry(.012,.016,.09,8),M.leaf);st.position.y=.43;gp.add(st);
      const out=new THREE.Vector3(Math.sin(th)*.9,.5,Math.cos(th)*.9).normalize();
      q.setFromUnitVectors(down,out);gp.quaternion.copy(q);gp.scale.setScalar(1.12);
      const rr=R-.5;gp.position.set(rr*Math.sin(th)-out.x*.2,H+.12,rr*Math.cos(th)-out.z*.2);

    });
  }
  /* candles */
  const flames=[];
  {
    const cg=new THREE.CylinderGeometry(.05,.05,.72,24),fT=new THREE.CanvasTexture(flameCanvas()),gT=new THREE.CanvasTexture(radialCanvas([[0,'rgba(255,175,80,.55)'],[.4,'rgba(255,140,40,.18)'],[1,'rgba(255,120,30,0)']]));
    fT.encoding=THREE.sRGBEncoding;gT.encoding=THREE.sRGBEncoding;
    [100,140,180,220,260].forEach((deg,i)=>{
      const th=deg*Math.PI/180,x=.6*Math.sin(th),z=.6*Math.cos(th),hh=.72+(i%2)*.05;
      const c=shadow(new THREE.Mesh(cg,M.candle));c.scale.y=hh/.72;c.position.set(x,H+hh/2,z);mainG.add(c);

      const gl=new THREE.Sprite(new THREE.SpriteMaterial({map:gT,blending:THREE.AdditiveBlending,transparent:true,depthWrite:false}));
      gl.position.set(x,H+hh+.2,z);gl.scale.set(1.5,1.5,1);mainG.add(gl);

  }
  /* cut-line decals */
  const cutLines=[];
  [-WEDGE/2,WEDGE/2].forEach(th=>{
    const top=new THREE.Mesh(new THREE.BoxGeometry(R,.004,.014),M.cutline);top.position.set(R/2*Math.sin(th),H+.004,R/2*Math.cos(th));top.rotation.y=th-Math.PI/2;
    const side=new THREE.Mesh(new THREE.BoxGeometry(.014,H,.012),M.cutline);side.position.set((R+.004)*Math.sin(th),H/2,(R+.004)*Math.cos(th));side.rotation.y=th;

  {

  }
  /* ----- cake server ----- */
  const server=new THREE.Group();server.visible=false;sliceG.add(server);
  {
    const sh=new THREE.Shape(),hw=.56;
    sh.moveTo(0,.04);sh.lineTo(hw,1.42);sh.quadraticCurveTo(hw*.9,1.56,0,1.58);sh.quadraticCurveTo(-hw*.9,1.56,-hw,1.42);sh.lineTo(0,.04);
    const bg=new THREE.ExtrudeGeometry(sh,{depth:.025,bevelEnabled:false});bg.rotateX(Math.PI/2);

    const hd=shadow(new THREE.Mesh(hg,M.wood));hd.position.z=.65;hgp.add(hd);
    const cap=new THREE.Mesh(new THREE.SphereGeometry(.07,12,10),M.gold);cap.position.z=1.3;hgp.add(cap);
  }

  /* smoke + crumbs */
  const smokeTex=new THREE.CanvasTexture(radialCanvas([[0,'rgba(235,228,245,.55)'],[.5,'rgba(220,212,235,.22)'],[1,'rgba(220,212,235,0)']]));
  const smokes=[],crumbs=[];

  G={renderer,scene,camera,canvas,cakeRoot,mainG,sliceG,flames,candleLight,key,cutLines,kroot,kin,server,plate1,plate2,M,
     smokeTex,smokes,crumbs,tw:[],view:null,V:null,stage:0,t0:performance.now(),last:performance.now(),smokeOn:false};
  fit();
  G.view={...G.V[0]};
  addEventListener('resize',fit);

}

/* ===== framing ===== */
function frame(cx,cy,cz,needW,needH,az,el){
  const camera=G.camera,v=camera.fov*Math.PI/180,a=camera.aspect;
  const d=Math.max(needH/2/Math.tan(v/2),needW/2/(Math.tan(v/2)*a));
  return {tx:cx,ty:cy,tz:cz,px:cx+Math.sin(az)*Math.cos(el)*d,py:cy+Math.sin(el)*d,pz:cz+Math.cos(az)*Math.cos(el)*d};
}
function layoutInfo(){
  const portrait=G.camera.aspect<.95;
  return {portrait,plate:portrait?{x:.3,z:4.7}:{x:4.6,z:1.2}};
}
function computeViews(){
  const L=layoutInfo(),el=.42;
  const v0=frame(0,1.05,0,5.7,5.1,-.1,el);
  let v1;
  if(L.portrait)v1=frame(0,1.0,2.0,6.0,9.2,0,.5);
  else{const left=-2.55,right=L.plate.x+1.75;v1=frame((left+right)/2,.95,.5,right-left+.9,5.2,-.05,.4)}
  G.V=[v0,v1];
}
function fit(){
  const c=G.canvas,w=c.clientWidth,h=c.clientHeight;if(!w||!h)return;
  G.renderer.setSize(w,h,false);G.camera.aspect=w/h;G.camera.updateProjectionMatrix();
  computeViews();if(G.stage<2)G.view={...G.V[G.stage]};
}

/* ===== tweens & loop ===== */
function T(ms,fn,ease){return new Promise(res=>G.tw.push({ms,fn,ease:ease||eio,res,t0:performance.now()}))}
function spawnSmoke(x,y,z){
  for(let i=0;i<4;i++){
    const s=new THREE.Sprite(new THREE.SpriteMaterial({map:G.smokeTex,transparent:true,depthWrite:false,opacity:0}));
    s.position.set(x+rand(-.02,.02),y,z+rand(-.02,.02));s.scale.set(.1,.1,1);
    s.userData={t:-i*.18,vx:rand(-.05,.05),vz:rand(-.05,.05),sz:rand(.5,.9)};G.cakeRoot.add(s);G.smokes.push(s);
  }
}
function spawnCrumbs(theta,n){
  const geo=new THREE.DodecahedronGeometry(1,0);
  for(let i=0;i<n;i++){
    const r=R-.05+Math.random()*.4,th=theta+rand(-.06,.06),sz=.015+Math.random()*.03;
    const m=new THREE.Mesh(geo,Math.random()<.2?G.M.cream:G.M.crumb);m.scale.setScalar(sz);m.castShadow=true;
    m.position.set(r*Math.sin(th),.05,r*Math.cos(th));
    m.userData={vx:Math.sin(th)*rand(.2,1.1)+rand(-.3,.3),vy:rand(.8,2),vz:Math.cos(th)*rand(.2,1.1)+rand(-.3,.3),sz,rest:false,rx:rand(-6,6),rz:rand(-6,6)};
    G.cakeRoot.add(m);G.crumbs.push(m);
  }
}
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-G.last)/1000);G.last=now;
  const tt=(now-G.t0)/1000;
  for(let i=G.tw.length-1;i>=0;i--){const w=G.tw[i],k=clamp((now-w.t0)/w.ms,0,1);w.fn(w.ease(k),k);if(k>=1){G.tw.splice(i,1);w.res()}}
  if(!$('#p2').classList.contains('active'))return;
  // flames
  let lightK=0;
  G.flames.forEach(f=>{
    const fl=1+.07*Math.sin(tt*18+f.ph)+.05*Math.sin(tt*31+f.ph*2.3);
    f.fl.scale.set(.21*(1+.05*Math.sin(tt*23+f.ph))*f.on,.42*fl*f.on,1);
    f.fl.position.x=f.x+Math.sin(tt*5+f.ph)*.012;
    f.gl.scale.setScalar(1.5*(.92+.08*Math.sin(tt*14+f.ph))*f.on);
    f.fl.visible=f.gl.visible=f.on>.01;lightK+=f.on;
  });
  G.candleLight.intensity=(lightK/G.flames.length)*(1.7+.35*Math.sin(tt*17)+.2*Math.sin(tt*29));
  // smoke
  for(let i=G.smokes.length-1;i>=0;i--){
    const s=G.smokes[i],u=s.userData;u.t+=dt;if(u.t<0)continue;
    const k=u.t/2.2;if(k>=1){G.cakeRoot.remove(s);s.material.dispose();G.smokes.splice(i,1);continue}
    s.position.y+=dt*.32;s.position.x+=u.vx*dt;s.position.z+=u.vz*dt;
    const sc=.12+k*u.sz;s.scale.set(sc,sc,1);s.material.opacity=Math.sin(Math.PI*Math.min(1,k*1.15))*.5;
  }
  // crumbs
  G.crumbs.forEach(m=>{const u=m.userData;if(u.rest)return;
    u.vy-=9*dt;m.position.x+=u.vx*dt;m.position.y+=u.vy*dt;m.position.z+=u.vz*dt;m.rotation.x+=u.rx*dt;m.rotation.z+=u.rz*dt;
    if(m.position.y<=u.sz*.6){m.position.y=u.sz*.6;if(Math.abs(u.vy)>.5){u.vy*=-.3;u.vx*=.5;u.vz*=.5}else u.rest=true}});
  // camera
  const v=G.view,cam=G.camera;
  cam.position.set(v.px+Math.sin(tt*.35)*.16,v.py+Math.sin(tt*.27)*.07,v.pz+Math.cos(tt*.3)*.1);
  cam.lookAt(v.tx,v.ty,v.tz);
  G.renderer.render(G.scene,cam);
}

/* ===== page-2 interaction ===== */
function setHint(txt,hide){const h=$('#hint2');h.textContent=txt;h.classList.toggle('hide',!!hide)}
function startCake(){
  try{
    if(typeof THREE==='undefined')throw new Error('three');
    if(!G)buildScene();
  }catch(e){
    console.warn('3D cake unavailable',e);G=null;
    $('#cake3d').style.display='none';$('#hint2').style.display='none';
    const n=$('#next2');n.style.display='inline-block';state=2;return;
  }
  setTimeout(()=>{CF.burst(innerWidth/2,innerHeight*.55,60,Math.PI*2,-Math.PI/2,[5,12])},900);
}
async function blow(){
  busy=true;setHint('',true);
  for(let i=0;i<G.flames.length;i++){
    await sleep(190);const f=G.flames[i];
    T(260,k=>{f.on=1-k},eout);
    spawnSmoke(f.x,f.y+.1,f.z);
  }
  await sleep(500);
  CF.burst(innerWidth/2,innerHeight*.5,80,Math.PI*2,-Math.PI/2,[4,12]);
  await sleep(900);state=1;busy=false;setHint('Tap to cut the cake');
}
async function cut(){
  busy=true;setHint('',true);
  const {kroot,kin,cutLines,sliceG,server,cakeRoot,scene,plate2}=G;
  const th=[-WEDGE/2,WEDGE/2],hi=H+1.1,lo=.08;
  kroot.visible=true;kroot.position.set(0,H+3.2,0);kroot.rotation.y=th[0]-Math.PI/2;kin.rotation.z=.5;
  await T(650,k=>{kroot.position.y=lerp(H+3.2,hi,k);kin.rotation.z=lerp(.5,.32,k)});
  for(let i=0;i<2;i++){
    if(i===1)await T(520,k=>{kroot.rotation.y=lerp(th[0],th[1],k)-Math.PI/2});
    const lines=[cutLines[i*2],cutLines[i*2+1]];
    await T(760,k=>{kroot.position.y=lerp(hi,lo,k);kin.rotation.z=lerp(.32,.3,k);lines.forEach(l=>l.material.opacity=Math.min(1,k*1.4))},eio);
    spawnCrumbs(th[i],10);
    await T(380,k=>{kin.rotation.z=lerp(.3,.05,k)},eio);
    spawnCrumbs(th[i],8);
    await T(520,k=>{kroot.position.y=lerp(lo,hi,k);kin.rotation.z=lerp(.05,.32,k)},eio);
  }
  await T(600,k=>{kroot.position.y=lerp(hi,H+3.4,k);kroot.position.x=k*2.5},ein);kroot.visible=false;
  // pull the slice out a little
  await T(500,k=>{sliceG.position.z=lerp(0,.2,k)},eout);
  // slide the server underneath
  server.visible=true;server.position.set(0,0,1.9);
  const L=layoutInfo(),alpha=L.portrait?1.3:1.35,dir=new THREE.Vector3(Math.sin(alpha),0,Math.cos(alpha));
  await T(700,k=>{server.position.z=lerp(1.9,.02,k);sliceG.position.y=.05*k},eio);
  // plate for the slice appears on the table
  plate2.visible=true;plate2.position.set(L.plate.x,0,L.plate.z);plate2.scale.setScalar(.01);
  scene.attach(sliceG);
  cutLines.forEach(l=>l.visible=false);
  const S=sliceG.position.clone(),E=new THREE.Vector3(L.plate.x,PLATE_TOP+.05,L.plate.z).addScaledVector(dir,-R*.6);
  G.stage=1;const v0={...G.view},v1=G.V[1];
  CF.big();
  await T(2200,(k,raw)=>{
    sliceG.position.set(lerp(S.x,E.x,k),lerp(S.y,E.y,k)+Math.sin(Math.PI*raw)*.95,lerp(S.z,E.z,k));
    sliceG.rotation.y=lerp(0,alpha,k);
    for(const key in v1)G.view[key]=lerp(v0[key],v1[key],k);
    plate2.scale.setScalar(.68*eout(clamp(raw*1.6,0,1)));
  },eio);
  G.stage=2;
  // set it down, draw the server out
  await T(750,k=>{server.position.z=lerp(.02,2.2,k);sliceG.position.y=lerp(E.y,PLATE_TOP,k)},eio);
  server.visible=false;
  $('#ttl2').textContent='Happy Birthday!';
  CF.burst(innerWidth/2,innerHeight*.45,100,Math.PI*2,-Math.PI/2,[6,16]);
  await sleep(500);
  state=2;busy=false;
  $('#hint2').style.display='none';const n=$('#next2');n.style.display='inline-block';
}
$('#p2').addEventListener('click',e=>{
  if(!cakeStarted||busy||state===2||!G)return;
  if(state===0)blow();else if(state===1)cut();
});
$('#next2').addEventListener('click',e=>{e.stopPropagation();go3()});
function go3(){
  setPhoto();show('#p3');setTimeout(()=>{p3ready=true},900);
  CF.burst(innerWidth/2,innerHeight*.5,70,Math.PI*2,-Math.PI/2,[5,12]);
}

/* ---------- countdown gate : the site opens on 29 Dec 2026 ---------- */
const OPEN_AT=new Date('2026-12-29T00:00:00+05:30').getTime();   // 29 Dec 2026, 12:00 AM India time (IST)
let siteOpen=false;
function replayAnim(root){
  root.querySelectorAll('.kicker,.script,.title,.name,.wish,.btn,.spark').forEach(el=>{el.style.animation='none';void el.offsetWidth;el.style.animation=''});
}
function openSite(instant){
  if(siteOpen)return;siteOpen=true;
  const p1=$('#p1');replayAnim(p1);
  if(instant){const p0=$('#p0');if(p0)p0.remove();p1.classList.add('active')}else show('#p1');
  window.startWishes&&window.startWishes();
  setTimeout(()=>CF.big(),instant?500:1300);
}
(function(){
  const q=new URLSearchParams(location.search);
  let target=OPEN_AT;
  if(q.has('demo'))target=Date.now()+(parseInt(q.get('demo'),10)||12)*1000;     // ?demo=10 -> opens in 10 s (for testing)
  if(q.has('preview')||Date.now()>=target){openSite(true);return}                 // ?preview -> skip the countdown (owner only)
  const N={d:$('#n-d'),h:$('#n-h'),m:$('#n-m'),s:$('#n-s')},B={d:$('#b-d'),h:$('#b-h'),m:$('#b-m'),s:$('#b-s')},prev={};
  const pad=n=>String(n).padStart(2,'0');
  function put(k,v,frac){
    const t=pad(v);
    if(N[k].textContent!==t){N[k].textContent=t;N[k].classList.remove('flip');void N[k].offsetWidth;N[k].classList.add('flip')}
    const b=B[k];
    if(prev[k]!==undefined&&frac<prev[k]-.4){b.style.transition='none';b.style.setProperty('--w',(frac*100)+'%');void b.offsetWidth;b.style.transition=''}
    else b.style.setProperty('--w',(frac*100)+'%');
    prev[k]=frac;
  }
  function render(ms){
    const s=Math.max(0,Math.floor(ms/1000)),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),sec=s%60;
    put('d',d,clamp(1-d/60,0,1));put('h',h,(24-h)/24);put('m',m,(60-m)/60);put('s',sec,(60-sec)/60);
  }
  render(target-Date.now());
  const timer=setInterval(()=>{
    const left=target-Date.now();render(left);
    if(left<=0){
      clearInterval(timer);
      const p0=$('#p0');p0.classList.add('itstime');$('#cdTitle').textContent="It's Time!";
      CF.big();setTimeout(()=>CF.big(),700);
      setTimeout(()=>openSite(false),2200);
    }
  },250);
})();
